aid: descartes-underwriting
name: Descartes Underwriting
description: >-
  Descartes Underwriting is a Paris-headquartered insurtech, founded in 2019,
  specializing in parametric insurance for climate, natural-catastrophe, cyber,
  and emerging corporate risks. It operates two complementary entities —
  Descartes Underwriting, a global parametric managing general agent (MGA), and
  Descartes Insurance, an ACPR-licensed European full-stack carrier — using AI,
  satellite imagery, IoT sensor data, and scientific risk models to structure
  index-based covers that pay out automatically within days when a predefined
  trigger is met, without a traditional claims-adjustment process. Backed by
  Battery Ventures and other investors, the company serves 600+ large
  corporations and public entities through corporate brokers across 20+ offices
  worldwide. No public developer API or documentation is published; the company
  distributes coverage through brokers rather than a self-serve API surface.
